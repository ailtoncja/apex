# Manda ao GitHub a lista completa das dependências do Gradle (inclusive as transitivas), para os alertas do Dependabot
# cobrirem Ktor, Netty, logback etc., e confere que o gradle-wrapper.jar é o oficial.
name: Dependências

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/dependency-submission@v6
