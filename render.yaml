# Hospedagem no Render (plano grátis, sem cartão). No painel: New > Blueprint > escolha este repositório.
# O servidor "dorme" após 15 minutos sem uso; o app já acorda ele ao abrir.
services:
  - type: web
    name: apex-server
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /health
    # Só refaz o deploy quando algo do servidor muda (assim, mexer no app não reinicia o servidor).
    buildFilter:
      paths:
        - server/**
        - shared/**
        - gradle/**
        - build.gradle.kts
        - settings.gradle.kts
        - gradle.properties
        - Dockerfile
    envVars:
      # Endereço do Neon (Connect > desligue "Connection pooling"). Preencha no painel; nunca no arquivo.
      - key: DATABASE_URL
        sync: false
      # Chave que assina os logins: o Render gera uma aleatória.
      - key: JWT_SECRET
        generateValue: true
      # Endereço público deste serviço (aparece no painel depois de criado), ex.: https://apex-server.onrender.com
      - key: PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      # Na Render o X-Forwarded-For chega como "cliente, Cloudflare, rede interna" (3 entradas); o Cloudflare também preenche CF-Connecting-IP.
      # Sem isso, quem inventa um X-Forwarded-For burla todos os limites de uso.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      - key: CLIENT_IP_HEADER
        value: "CF-Connecting-IP"
      # E-mail grátis sem domínio (relay no Apps Script/Vercel; veja docs/email-relay). Preencha no painel.
      - key: MAIL_WEBHOOK_URL
        sync: false
      - key: MAIL_WEBHOOK_SECRET
        sync: false
      # Quem responde pelo serviço: aparece na Política de Privacidade e nos Termos. Preencha no painel.
      - key: CONTACT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        sync: false
      # Proteção do banco grátis: limite de contas no total.
      - key: MAX_USERS
        value: "2000"
